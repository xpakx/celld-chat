<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Inria+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <title>Chat</title>
</head>

<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
(async () => {
    var app = Elm.Main.init({
      node: document.getElementById('app'),
      flags: ['test', 'test2']
    });

    let db = null;
    const identity = await getIdentity();
    const name = await readName();
    const WS_URL = "ws://localhost:8080/ws"; 
    app.ports.getMessage.send("Connecting to " + WS_URL + "...");
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        app.ports.getMessage.send("Connected successfully!");
        app.ports.changeStatus.send("Connected");
	register(ws, identity, name);
    };

    ws.onmessage = (event) => {
	console.log(event.data);
        app.ports.getMessage.send(event.data);
    };

    ws.onerror = (error) => {
        app.ports.getMessage.send("WebSocket Error occurred.");
        console.log(error);
    };

    ws.onclose = () => {
        app.ports.getMessage.send("Connection closed.");
        app.ports.changeStatus.send("Disconnected");
    };

    app.ports.sendMessage.subscribe(function(message) {
	    if (ws.readyState == WebSocket.OPEN) {
		broadcastMsg(ws, message, identity);
	    }
    });

    app.ports.changeUsername.subscribe(function(username) {
	    console.log(username);
	    saveName(username);
    });



    function openIndexedDB() {
	if (db) return Promise.resolve(db);

	return new Promise((resolve, reject) => {
		const request = indexedDB.open("CelldChatDB", 1);

		request.onsuccess = (event) => {
			db = event.target.result;
			db.onclose = () => { db = null; };
			resolve(db);
		};
		request.onupgradeneeded = (event) => {
			const db = event.target.result;
			if (!db.objectStoreNames.contains("keys")) {
				db.createObjectStore("keys");
			}
			if (!db.objectStoreNames.contains("userData")) {
				db.createObjectStore("userData");
			}
		};
		// onversionchange?

		request.onerror = (event) => reject(event.target.error);
	});
    }

    async function saveKey(key) {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["keys"], "readwrite");
	    tx.objectStore("keys")
		    .put(key, "chat-key");
    }

    async function readKey() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["keys"], "readonly");
	    const request = tx.objectStore("keys").get("chat-key");

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result);
		    request.onerror = (event) => reject(event.target.error);
	    });
    }

    async function getIdentity() {
	    let keyPair = await readKey();
	    if (!keyPair) {
		    keyPair = await window.crypto.subtle.generateKey(
			    { name: "ECDSA", namedCurve: "P-256" },
			    false,
			    ["sign", "verify"]
		    );
		    await saveKey(keyPair);
	    }

	    const pubJwk = await window.crypto.subtle.exportKey(
		    "jwk",
		    keyPair.publicKey
	    );
	    const pubString = JSON.stringify(pubJwk);

	    const hashBuffer = await window.crypto.subtle.digest(
		    "SHA-256",
		    new TextEncoder().encode(pubString)
	    );
	    const fingerprint = Array.from(new Uint8Array(hashBuffer))
		    .map(b => b.toString(16).padStart(2, '0'))
		    .join('')
		    .slice(0, 8);
	    return { keyPair, pubJwk, fingerprint };
    }

    function register(ws, identity, username) {
	    let regReq = {
		    type: 'register',
		    pubJwk: identity.pubJwk,
		    fingerprint: identity.fingerprint,
	    };
	    if (username) {
		    regReq['username'] = username;
	    }

	    const payload = JSON.stringify(regReq);
	    ws.send(payload);
	    // TODO: read them on the backend
    }

    async function broadcastMsg(ws, msg, identity) {
	    const timestamp = Date.now();
	    const payload = JSON.stringify({ msg, timestamp });
	    const signatureBuffer = await window.crypto.subtle.sign(
		    { name: "ECDSA", hash: { name: "SHA-256" } },
		    identity.keyPair.privateKey,
		    new TextEncoder().encode(payload)
	    );
	    const sig = btoa(String.fromCharCode(
		    ...new Uint8Array(signatureBuffer))
	    );
	    let msgReq = {
		    type: 'message',
		    msg: msg,
		    timestamp: timestamp,
		    signature: sig,
	    };
	    const finPayload = JSON.stringify(msgReq);
	    ws.send(finPayload);
    }

    async function saveName(username) {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["userData"], "readwrite");
	    tx.objectStore("userData")
		    .put(username, "username");
    }

    async function readName() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["userData"], "readonly");
	    const request = tx.objectStore("userData").get("username");

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result);
		    request.onerror = (event) => reject(event.target.error);
	    });
    }
})();
  </script>
</body>
</html>
