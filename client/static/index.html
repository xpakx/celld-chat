<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Inria+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <title>Chat</title>
</head>

<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
(async () => {
    let db = null;
    const channels = await getChannelNames();
    const friends = await getFriends();
    const timezoneOffset = -new Date().getTimezoneOffset();
    console.log(friends);

    var app = Elm.Main.init({
      node: document.getElementById('app'),
      flags: {
	      channels: channels,
	      timezoneOffset: timezoneOffset,
	      friends : friends,
      }
    });

    const identity = await getIdentity();
    const name = await readName();
    const WS_URL = "ws://localhost:8080/ws"; 
    app.ports.getMessage.send("Connecting to " + WS_URL + "...");
    let ws = connectWS();

    function connectWS(channel = undefined) {
	const url = WS_URL + (channel && channel !== "Global" ? `?room=${channel}` : "");
	const ws = new WebSocket(url);
        ws.onopen = onWSOpen;
        ws.onmessage = onWSMessage;
        ws.onerror = onWSError;
        ws.onclose = onWSClose;
	return ws;
    }

    function onWSOpen() {
        app.ports.getMessage.send("Connected successfully!");
        app.ports.changeStatus.send("Connected");
	register(ws, identity, name);
    }

    function onWSMessage(event) {
       console.log(event.data);
       app.ports.getMessage.send(event.data);
    } 

    function onWSError(error) {
        app.ports.getMessage.send("WebSocket Error occurred.");
        console.log(error);
    };

    function onWSClose() {
        app.ports.getMessage.send("Connection closed.");
        app.ports.changeStatus.send("Disconnected");
    };

    app.ports.sendMessage.subscribe(function(message) {
	    if (ws.readyState == WebSocket.OPEN) {
		broadcastMsg(ws, message, identity);
	    }
    });

    app.ports.changeUsername.subscribe(function(username) {
	    console.log(username);
	    saveName(username);
    });

    app.ports.switchChannel.subscribe(function(channelName) {
	    if (ws) ws.close();
	    ws = connectWS(channelName);
    });

    app.ports.newChannel.subscribe(function(channelName) {
	    if (ws) ws.close();
	    ws = connectWS(channelName);
	    saveChannel(channelName);
    });

    app.ports.removeChannel.subscribe(function(channelName) {
	    removeChannel(channelName);
    });

    app.ports.deleteMessage.subscribe(function(messageId) {
	    if (ws.readyState == WebSocket.OPEN) {
		broadcastDeletion(ws, messageId, identity);
	    }
    });

    app.ports.editMessage.subscribe(function([messageId, content]) {
	    if (ws.readyState == WebSocket.OPEN) {
		broadcastEdition(ws, messageId, content, identity);
	    }
    });

    app.ports.removeFriend.subscribe(function(friendFingerprint) {
	    removeFriend(friendFingerprint);
    });

    app.ports.addFriend.subscribe(function(friendFingerprint) {
	    saveFriend(friendFingerprint, null);
    });

    app.ports.updateFriend.subscribe(function([friendFingerprint, newName]) {
	    console.log(friendFingerprint, newName)
	    updateFriendName(friendFingerprint, newName);
    });

    function openIndexedDB() {
	if (db) return Promise.resolve(db);

	return new Promise((resolve, reject) => {
		const request = indexedDB.open("CelldChatDB", 2);

		request.onsuccess = (event) => {
			db = event.target.result;
			db.onclose = () => { db = null; };
			resolve(db);
		};
		request.onupgradeneeded = (event) => {
			const db = event.target.result;
			if (!db.objectStoreNames.contains("keys")) {
				db.createObjectStore("keys");
			}
			if (!db.objectStoreNames.contains("userData")) {
				db.createObjectStore("userData");
			}
			if (!db.objectStoreNames.contains('channels')) {
				const store = db.createObjectStore('channels', { keyPath: 'name' });
			}
			if (!db.objectStoreNames.contains('friends')) {
				const store = db.createObjectStore('friends', { keyPath: 'fingerprint' });
			}
		};
		// onversionchange?

		request.onerror = (event) => reject(event.target.error);
	});
    }

    async function saveKey(key) {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["keys"], "readwrite");
	    tx.objectStore("keys")
		    .put(key, "chat-key");
    }

    async function readKey() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["keys"], "readonly");
	    const request = tx.objectStore("keys").get("chat-key");

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result);
		    request.onerror = (event) => reject(event.target.error);
	    });
    }

    async function getIdentity() {
	    let keyPair = await readKey();
	    if (!keyPair) {
		    keyPair = await window.crypto.subtle.generateKey(
			    { name: "ECDSA", namedCurve: "P-256" },
			    false,
			    ["sign", "verify"]
		    );
		    await saveKey(keyPair);
	    }

	    const pubJwk = await window.crypto.subtle.exportKey(
		    "jwk",
		    keyPair.publicKey
	    );
	    const pubString = JSON.stringify(pubJwk);

	    const hashBuffer = await window.crypto.subtle.digest(
		    "SHA-256",
		    new TextEncoder().encode(pubString)
	    );
	    const fingerprint = Array.from(new Uint8Array(hashBuffer))
		    .map(b => b.toString(16).padStart(2, '0'))
		    .join('')
		    .slice(0, 8);
	    return { keyPair, pubJwk, fingerprint };
    }

    function register(ws, identity, username) {
	    let regReq = {
		    type: 'register',
		    pubJwk: identity.pubJwk,
		    fingerprint: identity.fingerprint,
	    };
	    if (username) {
		    regReq['username'] = username;
	    }

	    const payload = JSON.stringify(regReq);
	    ws.send(payload);
    }

    async function broadcastMsg(ws, msg, identity) {
	    const timestamp = Date.now();
	    const payload = JSON.stringify({ msg, timestamp });
	    const signatureBuffer = await window.crypto.subtle.sign(
		    { name: "ECDSA", hash: { name: "SHA-256" } },
		    identity.keyPair.privateKey,
		    new TextEncoder().encode(payload)
	    );
	    const sig = btoa(String.fromCharCode(
		    ...new Uint8Array(signatureBuffer))
	    );
	    let msgReq = {
		    type: 'message',
		    msg: msg,
		    timestamp: timestamp,
		    signature: sig,
	    };
	    const finPayload = JSON.stringify(msgReq);
	    ws.send(finPayload);
    }

    async function broadcastDeletion(ws, msgId, identity) {
	    const timestamp = Date.now();
	    const payload = JSON.stringify({
		    msg: msgId,
		    timestamp: timestamp ,
		    action: "DELETE",
	    });
	    const signatureBuffer = await window.crypto.subtle.sign(
		    { name: "ECDSA", hash: { name: "SHA-256" } },
		    identity.keyPair.privateKey,
		    new TextEncoder().encode(payload)
	    );
	    const sig = btoa(String.fromCharCode(
		    ...new Uint8Array(signatureBuffer))
	    );
	    let msgReq = {
		    type: 'delete',
		    id: msgId,
		    timestamp: timestamp,
		    signature: sig,
	    };
	    const finPayload = JSON.stringify(msgReq);
	    ws.send(finPayload);
    }


    async function broadcastEdition(ws, msgId, content, identity) {
	    const timestamp = Date.now();
	    const payload = JSON.stringify({
		    msg: msgId,
		    timestamp: timestamp,
		    content: content,
		    action: "EDIT",
	    });
	    const signatureBuffer = await window.crypto.subtle.sign(
		    { name: "ECDSA", hash: { name: "SHA-256" } },
		    identity.keyPair.privateKey,
		    new TextEncoder().encode(payload)
	    );
	    const sig = btoa(String.fromCharCode(
		    ...new Uint8Array(signatureBuffer))
	    );
	    let msgReq = {
		    type: 'edit',
		    signature: sig,
		    timestamp: timestamp,
		    id: msgId,
		    newMsg: content
	    };
	    const finPayload = JSON.stringify(msgReq);
	    ws.send(finPayload);
    }

    async function saveName(username) {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["userData"], "readwrite");
	    tx.objectStore("userData")
		    .put(username, "username");
    }

    async function readName() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["userData"], "readonly");
	    const request = tx.objectStore("userData").get("username");

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result);
		    request.onerror = (event) => reject(event.target.error);
	    });
    }

    async function saveChannel(channel) {
	    const db = await openIndexedDB();
	    const tx = db.transaction('channels', 'readwrite');

	    tx.objectStore("channels").put({
		    name: channel,
	    });
    }

    async function getChannelNames() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["channels"], "readonly");

	    const request = tx.objectStore("channels").getAll();

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result.map(r => r.name));
		    request.onerror = (event) => reject(event.target.error);
	    });
    }

    async function removeChannel(channel) {
	    const db = await openIndexedDB();
	    const tx = db.transaction('channels', 'readwrite');
	    tx.objectStore("channels").delete(channel);
    }

    async function getFriends() {
	    const database = await openIndexedDB();
	    const tx = database.transaction(["friends"], "readonly");

	    const request = tx.objectStore("friends").getAll();

	    return new Promise((resolve, reject) => {
		    request.onsuccess = () => resolve(request.result.map(r => {
			    return {localName: r.name, fingerprint: r.fingerprint}
		    }));
		    request.onerror = (event) => reject(event.target.error);
	    });
    }

    async function saveFriend(fingerprint, name) {
	    const db = await openIndexedDB();
	    const tx = db.transaction('friends', 'readwrite');

	    tx.objectStore("friends").put({
		    name: name,
		    fingerprint: fingerprint,
		    addedAt: Date.now(),
	    });
    }

    async function removeFriend(fingerprint) {
	    const db = await openIndexedDB();
	    const tx = db.transaction('friends', 'readwrite');
	    tx.objectStore("friends").delete(fingerprint);
    }

    async function updateFriendName(fingerprint, newName) {
        const db = await openIndexedDB();
        const tx = db.transaction('friends', 'readwrite');
        const store = tx.objectStore("friends");

        const request = store.get(fingerprint);
        
        request.onsuccess = () => {
            const friend = request.result;
            if (friend) {
                friend.name = newName;
                store.put(friend);
            }
        };
    }
})();
  </script>
</body>
</html>
