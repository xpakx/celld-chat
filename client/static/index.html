<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap" rel="stylesheet">

    <title>Chat</title>
</head>

<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    var app = Elm.Main.init({
      node: document.getElementById('app')
    });

    const WS_URL = "ws://localhost:8080/ws"; 
    app.ports.getMessage.send("Connecting to " + WS_URL + "...");
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        app.ports.getMessage.send("Connected successfully!");
        app.ports.changeStatus.send("Connected");
    };

    ws.onmessage = (event) => {
        app.ports.getMessage.send(event.data);
    };

    ws.onerror = (error) => {
        app.ports.getMessage.send("WebSocket Error occurred.");
        console.log(error);
    };

    ws.onclose = () => {
        app.ports.getMessage.send("Connection closed.");
        app.ports.changeStatus.send("Disconnected");
    };

    app.ports.sendMessage.subscribe(function(message) {
	    if (ws.readyState == WebSocket.OPEN) {
	        ws.send(message);
	    }
    });
  </script>
</body>
</html>
